name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build
      - name: Publish self-contained x64
        shell: powershell
        run: .\scripts\publish.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: ZwiftAccountSwitcher-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
